# git-scan package defaults — base layer of the layered config.
#
# User overrides: ~/.config/git-scan/git-scan.yaml
# Project overrides: ./git-scan.yaml (repo root)
#
# Arrays of dicts merge by composite key (id + name).
# Every entry says what a match does: 'match' (block, judgment, warn or
# ignore; block when absent) and 'relaxed', the same in a relaxed review
# (absent: as match). Turn an inherited entry off with match: ignore.
# Patterns are regex. Token, key and identifier formats are case-sensitive
# (ignore_case: false); every other pattern ignores letter case by default.
# 'specifics' names the thing an entry matches, in words; an entry with
# specifics and no pattern is for the privacy review alone.
---

entropy:
  enabled: true
  threshold: 4.2
  min_len: 20
  exclusions:
    - id: npm-integrity
      file_glob: "*lock.json"
      content_pattern: '"integrity":\s*"sha\d+-[^"]+"'
    - id: yarn-integrity
      file_glob: "yarn.lock"
      content_pattern: 'integrity\s+sha\d+-\S+'
    - id: commit-sha-in-docs
      file_glob: "*.md"
      content_pattern: 'https://github\.com/[^/]+/[^/]+/commit/[a-f0-9]{40}'

thresholds:
  large_amount: 300000
  suspicious_nonround: 10000
  suspicious_any: 100000
  cents_review: 500

patterns:
  # --- Tokens & credentials ---
  - id: github-pat
    pattern: "ghp_[0-9a-zA-Z]{36}"
    category: token
    specifics: a GitHub personal access token
    ignore_case: false
  - id: github-fine-grained
    pattern: "github[_]pat[_][a-zA-Z0-9_]+"
    category: token
    specifics: a fine-grained GitHub personal access token
    ignore_case: false
  - id: google-oauth-access
    pattern: "ya29\\.[a-zA-Z0-9._-]+"
    category: token
    specifics: a Google OAuth access token
    ignore_case: false
  - id: google-oauth-client-id
    pattern: "[0-9]+-[a-z0-9]+\\.apps\\.googleusercontent\\.com"
    category: token
    specifics: a Google OAuth client id
    ignore_case: false
  - id: google-oauth-client-secret
    pattern: "GOCSPX-[a-zA-Z0-9_-]+"
    category: token
    specifics: a Google OAuth client secret
    ignore_case: false
  - id: google-oauth-refresh
    pattern: "1//[0-9a-zA-Z_-]+"
    category: token
    specifics: a Google OAuth refresh token
    ignore_case: false
  - id: google-api-key
    pattern: "AIza[a-zA-Z0-9_-]{35}"
    category: token
    specifics: a Google API key
    ignore_case: false
  - id: openai-key
    pattern: "sk-[a-zA-Z0-9]{48}"
    category: token
    specifics: an OpenAI API key
    ignore_case: false
  - id: slack-token
    pattern: "xox[bp]-[a-zA-Z0-9-]+"
    category: token
    specifics: a Slack bot or user token
    ignore_case: false
  - id: aws-access-key
    pattern: "\\bAKIA[A-Z0-9]{16}\\b"
    category: token
    specifics: an AWS access key id
    ignore_case: false

  # --- Private keys ---
  # Patterns use regex construction to avoid containing the literal key header,
  # which would trigger secret scanners on this file itself.
  - id: rsa-private-key
    pattern: "[-]{5}BEGIN[ ]RSA[ ]PRIVATE[ ]KEY[-]{5}"
    category: key
    specifics: the header of an RSA private key
    ignore_case: false
  - id: openssh-private-key
    pattern: "[-]{5}BEGIN[ ]OPENSSH[ ]PRIVATE[ ]KEY[-]{5}"
    category: key
    specifics: the header of an OpenSSH private key
    ignore_case: false

  - id: generic-api-key
    # Four or more 8-character alphanumeric groups joined by - _ or .
    pattern: "\\b[a-zA-Z0-9]{8}(?:[-_.][a-zA-Z0-9]{8}){3,}\\b"
    category: token
    specifics: an API key of four or more eight-character groups
    ignore_case: false
  # --- Identifiers ---
  - id: uuid-dashed
    pattern: "\\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\b"
    category: identifier
    specifics: a UUID with dashes
    ignore_case: false
  - id: uuid-compact
    pattern: "\\b[0-9a-fA-F]{32}\\b"
    category: identifier
    specifics: a UUID without dashes, 32 hex characters
    ignore_case: false
  - id: uuid-underscore
    pattern: "\\b[0-9a-fA-F]{8}_[0-9a-fA-F]{4}_[0-9a-fA-F]{4}_[0-9a-fA-F]{4}_[0-9a-fA-F]{12}\\b"
    category: identifier
    specifics: a UUID with underscores
    ignore_case: false
  - id: hex-40
    pattern: "\\b[a-f0-9]{40}\\b"
    category: identifier
    specifics: a 40-character hex string, such as a full commit id or a SHA-1 digest
    ignore_case: false
  # --- Paths ---
  - id: user-home-path
    pattern: "(/Users/|/home/|C:\\\\Users\\\\)[^/\\\\\\s]+[/\\\\]"
    category: path
    specifics: a user's home-directory path
    relaxed: warn
  # --- For the privacy review only (no pattern: a reviewer recognises these) ---
  - id: credentials
    category: credential
    specifics: a credential written out in plain language, not in a token format
  - id: financial
    category: financial
    specifics: "the owner's financial facts in words: a balance, a card or routing number"
  - id: account-ids
    category: account
    specifics: an identifier of a specific account at a cloud or online service
  - id: people
    category: people
    specifics: another person's name, email address or handle
    relaxed: warn
  - id: trackers
    category: tracker
    specifics: a key or link to a private tracker, wiki or workspace
    relaxed: warn
  - id: personal-framing
    category: framing
    specifics: a description of the author's own setup, chores or personal use
    match: judgment
    relaxed: ignore
  - id: history
    category: history
    specifics: "an account of who did what: session or agent chatter, hand-offs, process narration"
    relaxed: ignore
