[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "git-scan"
version = "0.3.0"
description = "Git precommit scanner for sensitive data"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.0,<2",
]
dev = [
    "pytest>=7.0",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
git-scan = "git_scan.cli.main:cli"
git-scan-mcp = "git_scan.mcp.server:main"

[tool.setuptools.packages.find]
include = ["git_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
